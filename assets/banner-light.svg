<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="插画：需求、文档、数据经过 AI 汇聚，流向 PRD、Skill、Agent。善用 AI 提效，搭建工作流"><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.halo{transform-origin:600px 140px;animation:breathe 3.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.35);opacity:.35}}.f1{animation:bob 5s ease-in-out infinite}.f2{animation:bob 6s ease-in-out -2s infinite}.f3{animation:bob 7s ease-in-out -4s infinite}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FAFF"/><stop offset="1" stop-color="#F1FBF7"/></linearGradient><radialGradient id="b1"><stop offset="0" stop-color="#D6E5FF" stop-opacity="0.75"/><stop offset="1" stop-color="#D6E5FF" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop offset="0" stop-color="#CFF3E6" stop-opacity="0.75"/><stop offset="1" stop-color="#CFF3E6" stop-opacity="0"/></radialGradient><radialGradient id="b3"><stop offset="0" stop-color="#E6E1FF" stop-opacity="0.75"/><stop offset="1" stop-color="#E6E1FF" stop-opacity="0"/></radialGradient><radialGradient id="glow"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#14B892"/></linearGradient><clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="24"/></clipPath><filter id="sh" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.08"/></filter></defs><g clip-path="url(#card)"><rect width="1