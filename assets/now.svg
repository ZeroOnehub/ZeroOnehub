<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="正在研究"><title>正在研究</title><style>.s{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}.m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes sh{from{transform:translateX(-160px)}to{transform:translateX(160px)}}.sh{animation:sh 2.4s ease-in-out infinite}</style><defs><radialGradient id="ng" cx="0" cy="0" r="0.8"><stop offset="0" stop-color="#4D6BFE" stop-opacity="0.18"/><stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/></radialGradient><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><defs><linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111833"/><stop offset="1" stop-color="#0A0F1F"/></linearGradient><clipPath id="nclip"><rect width="1200" height="340" rx="24"/></clipPath></defs><g clip-path="url(#nclip)"><rect width="1200" height="340" fill="url(#nbg)"/><rect width="1200" height="340" fill="url(#ng)"/></g><rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#1E2A4A"/><text x="40" y="54" class="m" font-size="20" font-weight="600" fill="#4D6BFE" text-anchor="start" >~/now</text><text x="118" y="54" class="s" font-size="21" font-weight="600" fill="#E8ECF7" text-anchor="start" >这两周在研究</text><text x="1160" y="54" class="m" font-size="15" font-weight="400" fill="#8A93AD" text-anchor="end" >updated 2026-10-19 · 每周更新</text><line x1="40" y1="76" x2="1160" y2="76" stroke="#1E2A4A"/><text x="40" y="128" class="m" font-size="24" font-weight="600" fill="#4D6BFE" text-anchor="start" >01</text><text x="100" y="126" class="s" font-size="22" font-weight="600" fill="#E8ECF7" text-anchor="start" >DeepSeek Harness 的插件架构</text><text x="100" y="156" class="s" font-size="18" font-weight="400" fill="#A9B2CC" text-anchor="start" >everything-is-a-plugin + Cordis：Skill 加载只是开始，治理才是难题</text><g transform="translate(1077.5,100)"><rect x="0" y="0" width="82.5" height="28.5" rx="14.2" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.45"/><text x="11.2" y="19.1" class="m" font-size="15" font-weight="400" fill="#38BDF8" text-anchor="start" >拆源码中</text></g><clipPath id="bar0"><rect x="1000" y="144" width="160" height="6" rx="3"/></clipPath><rect x="1000" y="144" width="160" height="6" rx="3" fill="#1E2A4A"/><g clip-path="url(#bar0)"><rect x="1000" y="144" width="88" height="6" fill="#38BDF8"/><rect class="sh" x="1000" y="144" width="60" height="6" fill="url(#shine)" style="animation-delay:0.0s"/></g><line x1="100" y1="174" x2="1160" y2="174" stroke="#1E2A4A" stroke-dasharray="3 5"/><text x="40" y="208" class="m" font-size="24" font-weight="600" fill="#4D6BFE" text-anchor="start" >02</text><text x="100" y="206" class="s" font-size="22" font-weight="600" fill="#E8ECF7" text-anchor="start" >SKILL.md 工作流设计</text><text x="100" y="236" class="s" font-size="18" font-weight="400" fill="#A9B2CC" text-anchor="start" >让 Skill 既能被 Agent 稳定调用，又能把进度和产出物交还给人</text><g transform="translate(1047.5,180)"><rect x="0" y="0" width="112.5" height="28.5" rx="14.2" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.45"/><text x="11.2" y="19.1" class="m" font-size="15" font-weight="400" fill="#38BDF8" text-anchor="start" >在工坊里实践</text></g><clipPath id="bar1"><rect x="1000" y="224" width="160" height="6" rx="3"/></clipPath><rect x="1000" y="224" width="160" height="6" rx="3" fill="#1E2A4A"/><g clip-path="url(#bar1)"><rect x="1000" y="224" width="112" height="6" fill="#38BDF8"/><rect class="sh" x="1000" y="224" width="60" height="6" fill="url(#shine)" style="animation-delay:0.5s"/></g><line x1="100" y1="254" x2="1160" y2="254" stroke="#1E2A4A" stroke-dasharray="3 5"/><text x="40" y="288" class="m" font-size="24" font-weight="600" fill="#4D6BFE" text-anchor="start" >03</text><text x="100" y="286" class="s" font-size="22" font-weight="600" fill="#E8ECF7" text-anchor="start" >AI + 非遗数字化</text><text x="100" y="316" class="s" font-size="18" font-weight="400" fill="#A9B2CC" text-anchor="start" >用 3D、视频生成模型和知识库 Agent，让传统手艺可探索、可参与</text><g transform="translate(1031.8,260)"><rect x="0" y="0" width="128.2" height="28.5" rx="14.2" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.45"/><text x="11.2" y="19.1" class="m" font-size="15" font-weight="400" fill="#38BDF8" text-anchor="start" >做 3.0 陶瓷篇</text></g><clipPath id="bar2"><rect x="1000" y="304" width="160" height="6" rx="3"/></clipPath><rect x="1000" y="304" width="160" height="6" rx="3" fill="#1E2A4A"/><g clip-path="url(#bar2)"><rect x="1000" y="304" width="64" height="6" fill="#38BDF8"/><rect class="sh" x="1000" y="304" width="60" height="6" fill="url(#shine)" style="animation-delay:1.0s"/></g></svg>
