<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-label="这两周在研究：DeepSeek Harness 插件架构：Skill 加载只是开始，治理才是难题；SKILL.md 工作流：让 Agent 稳定调用，也把进度交还给人；AI + 非遗数字化：用 3D 和视频生成，让传统手艺可参与"><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif}.flow{stroke-dasharray:3 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-12}}.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect x="1" y="1" width="1198" height="276" rx="16" fill="#111A2C" stroke="#22304A" stroke-width="1.5"/><text x="32" y="68" class="m" font-size="15" fill="#5B95FF">#01</text><text x="96" y="68" font-size="21" font-weight="700" fill="#E7EEFA">DeepSeek Harness 插件架构</text><text x="560" y="68" font-size="18" fill="#B6C3D8">Skill 加载只是开始，治理才是难题</text><line x1="32" y1="94" x2="1168" y2="94" stroke="#22304A" stroke-width="1.2"/><text x="32" y="134" class="m" font-size="15" fill="#5B95FF">#02</text><text x="96" y="134" font-size="21" font-weight="700" fill="#E7EEFA">SKILL.md 工作流</text><text x="560" y="134" font-size="18" fill="#B6C3D8">让 Agent 稳定调用，也把进度交还给人</text><line x1="32" y1="160" x2="1168" y2="160" stroke="#22304A" stroke-width="1.2"/><text x="32" y="200" class="m" font-size="15" fill="#5B95FF">#03</text><text x="96" y="200" font-size="21" font-weight="700" fill="#E7EEFA">AI + 非遗数字化</text><text x="560" y="200" font-size="18" fill="#B6C3D8">用 3D 和视频生成，让传统手艺可参与</text><line x1="32" y1="226" x2="1168" y2="226" stroke="#22304A" stroke-width="1.2"/><text x="32" y="258" class="m" font-size="13" fill="#7D8AA1">更新于 2026-10-19 · 每周更新</text></svg>
